<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LolYouAll — Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
            cursor: default;
        }

        /* Elite Deep Space Nebula & Lightning Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Pure White Pixel UFO Follower */
        #ufo-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* e-z.bio Style Floating Glass Card with Glow */
        .profile-card {
            width: 480px;
            background: rgba(10, 10, 16, 0.75);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            padding: 36px 32px 28px 32px;
            box-shadow: 0 50px 120px rgba(0, 0, 0, 0.95), 
                        0 0 80px rgba(168, 85, 247, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            animation: cardFloat 7s ease-in-out infinite;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(0.2deg); }
        }

        /* Views Badge (Matching e-z.bio top left) */
        .views-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 18px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .views-badge i {
            color: #a855f7;
            font-size: 14px;
        }

        /* Avatar Section */
        .avatar-container {
            display: flex;
            justify-content: center;
            margin-bottom: 22px;
        }

        .avatar-ring {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #a855f7, #3b82f6, #ffffff);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.4);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #12121a;
        }

        /* Profile Info */
        .profile-info {
            text-align: center;
            margin-bottom: 26px;
        }

        .profile-name {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #ffffff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-name .badges {
            display: inline-flex;
            gap: 4px;
            font-size: 18px;
        }

        .profile-bio {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.65);
            font-weight: 500;
        }

        /* Social Icons Grid */
        .social-grid {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 30px;
            padding-bottom: 26px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(168, 85, 247, 0.6);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.4);
            color: #c084fc;
        }

        /* Discord Widget Card */
        .discord-widget {
            background: rgba(15, 15, 26, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .discord-widget:hover {
            border-color: rgba(88, 101, 242, 0.6);
            background: rgba(22, 22, 40, 0.9);
            box-shadow: 0 10px 35px rgba(88, 101, 242, 0.25);
        }

        .discord-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .discord-avatar-wrapper {
            position: relative;
            width: 48px;
            height: 48px;
        }

        .discord-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .status-dot {
            position: absolute;
            bottom: 0px;
            right: 0px;
            width: 12px;
            height: 12px;
            background-color: #23a55a;
            border: 2px solid #0f0f1a;
            border-radius: 50%;
        }

        .discord-text .username {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .discord-text .status-msg {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 2px;
        }

        .discord-action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .discord-widget:hover .discord-action-btn {
            background: #5865F2;
            border-color: #5865F2;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
        }
    </style>
</head>
<body>

    <!-- Galaxy Nebula & Thunder Background -->
    <canvas id="bg-canvas"></canvas>
    
    <!-- Pure White Pixel UFO Follower -->
    <canvas id="ufo-canvas"></canvas>

    <div class="container">
        <div class="profile-card">
            <div class="views-badge">
                <i class="fa-solid fa-eye"></i>
                <span>2,885</span>
            </div>

            <div class="avatar-container">
                <div class="avatar-ring">
                    <img id="yt-avatar" class="avatar-img" src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=300" alt="LolYouAll Avatar">
                </div>
            </div>

            <div class="profile-info">
                <h1 class="profile-name">
                    LolYouAll
                    <span class="badges">✨💎</span>
                </h1>
                <p class="profile-bio">Video Production • @LolYouAll</p>
            </div>

            <div class="social-grid">
                <a href="https://www.youtube.com/@LolYouAllBS" target="_blank" class="social-btn" title="YouTube">
                    <i class="fa-brands fa-youtube"></i>
                </a>
                <a href="https://discord.gg/KAyKNPFY56" target="_blank" class="social-btn" title="Discord Server">
                    <i class="fa-brands fa-discord"></i>
                </a>
                <a href="https://www.youtube.com/@LolYouAllBS" target="_blank" class="social-btn" title="Creator Studio">
                    <i class="fa-solid fa-video"></i>
                </a>
                <a href="https://www.youtube.com/@LolYouAllBS" target="_blank" class="social-btn" title="Website">
                    <i class="fa-solid fa-globe"></i>
                </a>
            </div>

            <a href="https://discord.com/users/978601102142476312" target="_blank" class="discord-widget">
                <div class="discord-user-info">
                    <div class="discord-avatar-wrapper">
                        <img id="discord-avatar" class="discord-avatar" src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=100" alt="Discord Avatar">
                        <div class="status-dot"></div>
                    </div>
                    <div class="discord-text">
                        <div class="username">@lolyouall <i class="fa-solid fa-circle-check" style="color: #5865F2; font-size: 11px;"></i></div>
                        <div class="status-msg">Dont touch my Teddy 🔥❤️</div>
                    </div>
                </div>
                <div class="discord-action-btn">
                    Add <i class="fa-solid fa-arrow-right" style="font-size: 11px;"></i>
                </div>
            </a>
        </div>
    </div>

    <script>
        // --- Photorealistic Galaxy Nebula & Thunder Engine ---
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');

        let width = bgCanvas.width = window.innerWidth;
        let height = bgCanvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = bgCanvas.width = window.innerWidth;
            height = bgCanvas.height = window.innerHeight;
        });

        const stars = [];
        for (let i = 0; i < 350; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2.2,
                alpha: Math.random(),
                speed: 0.003 + Math.random() * 0.012
            });
        }

        let lightningTimer = 0;
        let activeLightning = null;

        function createBolt() {
            const startX = Math.random() * width;
            const points = [{x: startX, y: 0}];
            let currX = startX;
            let currY = 0;

            while (currY < height * 0.8) {
                currX += (Math.random() - 0.5) * 90;
                currY += Math.random() * 45 + 15;
                points.push({x: currX, y: currY});
            }
            return { points, alpha: 1.0, decay: 0.04 };
        }

        function renderScene() {
            bgCtx.fillStyle = '#000000';
            bgCtx.fillRect(0, 0, width, height);

            // Volumetric cosmic gas clouds
            const neb1 = bgCtx.createRadialGradient(width * 0.3, height * 0.3, 100, width * 0.3, height * 0.3, width * 0.85);
            neb1.addColorStop(0, 'rgba(88, 28, 135, 0.28)');
            neb1.addColorStop(0.5, 'rgba(30, 27, 75, 0.18)');
            neb1.addColorStop(1, 'transparent');
            bgCtx.fillStyle = neb1;
            bgCtx.fillRect(0, 0, width, height);

            const neb2 = bgCtx.createRadialGradient(width * 0.75, height * 0.7, 80, width * 0.75, height * 0.7, width * 0.75);
            neb2.addColorStop(0, 'rgba(147, 51, 234, 0.22)');
            neb2.addColorStop(0.5, 'rgba(59, 130, 246, 0.12)');
            neb2.addColorStop(1, 'transparent');
            bgCtx.fillStyle = neb2;
            bgCtx.fillRect(0, 0, width, height);

            // Twinkling stars
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0.2) star.speed *= -1;
                bgCtx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                bgCtx.beginPath();
                bgCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                bgCtx.fill();
            });

            // Random thunder flash
            lightningTimer++;
            if (lightningTimer > 110 + Math.random() * 150) {
                activeLightning = createBolt();
                lightningTimer = 0;
            }

            if (activeLightning) {
                bgCtx.save();
                bgCtx.shadowBlur = 45;
                bgCtx.shadowColor = 'rgba(255, 255, 255, 0.95)';
                bgCtx.strokeStyle = `rgba(240, 240, 255, ${activeLightning.alpha})`;
                bgCtx.lineWidth = 3.5;
                bgCtx.beginPath();
                activeLightning.points.forEach((p, idx) => {
                    if (idx === 0) bgCtx.moveTo(p.x, p.y);
                    else bgCtx.lineTo(p.x, p.y);
                });
                bgCtx.stroke();
                bgCtx.restore();

                bgCtx.fillStyle = `rgba(168, 85, 247, ${activeLightning.alpha * 0.18})`;
                bgCtx.fillRect(0, 0, width, height);

                activeLightning.alpha -= activeLightning.decay;
                if (activeLightning.alpha <= 0) activeLightning = null;
            }

            requestAnimationFrame(renderScene);
        }
        requestAnimationFrame(renderScene);


        // --- Pure White Pixel UFO Follower Engine ---
        const ufoCanvas = document.getElementById('ufo-canvas');
        const ufoCtx = ufoCanvas.getContext('2d');

        let ufoWidth = ufoCanvas.width = window.innerWidth;
        let ufoHeight = ufoCanvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            ufoWidth = ufoCanvas.width = window.innerWidth;
            ufoHeight = ufoCanvas.height = window.innerHeight;
        });

        let mouse = { x: ufoWidth / 2, y: ufoHeight / 2 };
        let ufo = { x: ufoWidth / 2, y: ufoHeight / 2, vx: 0, vy: 0 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        function drawPureWhiteUFO(x, y, angle) {
            ufoCtx.save();
            ufoCtx.translate(x, y);
            ufoCtx.rotate(angle * 0.15);

            const scale = 2.4;
            ufoCtx.imageSmoothingEnabled = false;

            // Pure white glowing tractor beam
            const beam = ufoCtx.createLinearGradient(0, 10, 0, 110);
            beam.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
            beam.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
            ufoCtx.fillStyle = beam;
            ufoCtx.beginPath();
            ufoCtx.moveTo(-12 * scale, 10);
            ufoCtx.lineTo(12 * scale, 10);
            ufoCtx.lineTo(35 * scale, 110);
            ufoCtx.lineTo(-35 * scale, 110);
            ufoCtx.closePath();
            ufoCtx.fill();

            // Pure White Pixel UFO Hull
            ufoCtx.fillStyle = '#ffffff';
            ufoCtx.shadowColor = '#ffffff';
            ufoCtx.shadowBlur = 20;

            ufoCtx.fillRect(-16 * scale, 4 * scale, 32 * scale, 5 * scale);
            ufoCtx.fillRect(-12 * scale, 0, 24 * scale, 4 * scale);
            ufoCtx.fillRect(-7 * scale, -6 * scale, 14 * scale, 6 * scale);

            ufoCtx.restore();
        }

        function animateUFO() {
            ufoCtx.clearRect(0, 0, ufoWidth, ufoHeight);

            const dx = mouse.x - ufo.x;
            const dy = (mouse.y - 50) - ufo.y;

            ufo.vx += dx * 0.06;
            ufo.vy += dy * 0.06;
            ufo.vx *= 0.8;
            ufo.vy *= 0.8;

            ufo.x += ufo.vx;
            ufo.y += ufo.vy;

            drawPureWhiteUFO(ufo.x, ufo.y, ufo.vx);

            requestAnimationFrame(animateUFO);
        }
        requestAnimationFrame(animateUFO);
    </script>
</body>
</html>
