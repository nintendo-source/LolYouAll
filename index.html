<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@LolYouAll | e-z.bio Premium</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  
  <!-- Inter & Syne Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #020205;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* CRT Scanlines Overlay */
    .crt-overlay {
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
    }

    /* Extreme Cyber Glitch Animation */
    .glitch-text {
      position: relative;
      display: inline-block;
    }

    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      clip: rect(0, 0, 0, 0);
    }

    .glitch-text::before {
      left: -2px;
      text-shadow: 2px 0 #06b6d4;
      animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
    }

    .glitch-text::after {
      left: 2px;
      text-shadow: -2px 0 #ec4899;
      animation: glitch-anim-2 3s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim-1 {
      0% { clip: rect(10px, 9999px, 30px, 0); transform: skew(0.3deg); }
      20% { clip: rect(40px, 9999px, 50px, 0); transform: skew(-0.5deg); }
      40% { clip: rect(15px, 9999px, 25px, 0); transform: skew(0.8deg); }
      60% { clip: rect(60px, 9999px, 75px, 0); transform: skew(-0.2deg); }
      80% { clip: rect(5px, 9999px, 35px, 0); transform: skew(0.5deg); }
      100% { clip: rect(0, 0, 0, 0); }
    }

    @keyframes glitch-anim-2 {
      0% { clip: rect(60px, 9999px, 80px, 0); transform: skew(-0.8deg); }
      20% { clip: rect(20px, 9999px, 35px, 0); transform: skew(0.4deg); }
      40% { clip: rect(70px, 9999px, 90px, 0); transform: skew(-0.3deg); }
      60% { clip: rect(10px, 9999px, 30px, 0); transform: skew(0.6deg); }
      80% { clip: rect(45px, 9999px, 55px, 0); transform: skew(-0.5deg); }
      100% { clip: rect(0, 0, 0, 0); }
    }

    /* Extreme Ultra-Intense Multi-Layered Neon Glow */
    .ultra-neon-glow {
      box-shadow: 0 0 60px rgba(168, 85, 247, 0.5),
                  0 0 120px rgba(6, 182, 212, 0.35),
                  0 0 180px rgba(236, 72, 153, 0.25),
                  inset 0 0 35px rgba(168, 85, 247, 0.2),
                  inset 0 1px 3px rgba(255, 255, 255, 0.5);
      animation: neonPulseExtreme 4s ease-in-out infinite alternate;
    }

    @keyframes neonPulseExtreme {
      0% {
        box-shadow: 0 0 50px rgba(168, 85, 247, 0.5),
                    0 0 100px rgba(6, 182, 212, 0.35),
                    0 0 150px rgba(236, 72, 153, 0.2),
                    inset 0 0 25px rgba(168, 85, 247, 0.2);
      }
      100% {
        box-shadow: 0 0 85px rgba(236, 72, 153, 0.65),
                    0 0 150px rgba(168, 85, 247, 0.45),
                    0 0 220px rgba(6, 182, 212, 0.35),
                    inset 0 0 45px rgba(6, 182, 212, 0.3);
      }
    }

    /* Cyber Glass Card Body */
    .cyber-card {
      background: rgba(8, 8, 18, 0.85);
      backdrop-filter: blur(36px);
      -webkit-backdrop-filter: blur(36px);
      border: 1.5px solid rgba(168, 85, 247, 0.45);
      position: relative;
    }

    /* Glowing Edge Accent Border */
    .cyber-card::before {
      content: '';
      position: absolute;
      inset: -1.5px;
      border-radius: 33px;
      padding: 1.5px;
      background: linear-gradient(135deg, #a855f7, #06b6d4, #ec4899, #ffffff);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Neon Pill Container */
    .cyber-pill {
      background: rgba(14, 14, 26, 0.85);
      border: 1.5px solid rgba(168, 85, 247, 0.35);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.2), inset 0 0 20px rgba(168, 85, 247, 0.1);
      transition: all 0.3s ease;
    }
    .cyber-pill:hover {
      border-color: rgba(6, 182, 212, 0.8);
      box-shadow: 0 0 40px rgba(6, 182, 212, 0.45), inset 0 0 25px rgba(6, 182, 212, 0.2);
    }

    /* Neon Buttons */
    .neon-social-btn {
      width: 50px;
      height: 50px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 1.2rem;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
    }
    .neon-social-btn:hover {
      background: #ffffff;
      color: #000000;
      transform: translateY(-5px) scale(1.08);
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.9), 0 0 60px rgba(168, 85, 247, 0.7);
    }

    /* Avatar Gradient Ring Glow */
    .neon-avatar-ring {
      background: linear-gradient(135deg, #a855f7, #06b6d4, #ec4899, #ffffff);
      background-size: 300% 300%;
      animation: avatarGradient 4s ease infinite;
      box-shadow: 0 0 45px rgba(168, 85, 247, 0.85), 0 0 80px rgba(6, 182, 212, 0.5);
    }

    @keyframes avatarGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #ufo-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
      image-rendering: pixelated;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative bg-[#020205] text-white overflow-hidden">

  <!-- TV Glitch CRT Overlay -->
  <div class="fixed inset-0 crt-overlay z-20 pointer-events-none"></div>

  <!-- Cosmic Falling Galaxy Stones & Meteors Canvas -->
  <canvas id="galaxy-stones-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

  <!-- Pure White Pixel UFO Mouse Follower Overlay -->
  <canvas id="ufo-canvas"></canvas>

  <!-- Main Floating $100 Glassmorphism Neon Card -->
  <main class="w-full max-w-[490px] cyber-card rounded-[32px] p-7 sm:p-9 relative z-10 ultra-neon-glow my-6 transition-transform duration-500 hover:scale-[1.01]">
    
    <!-- Top Views Count Badge -->
    <div class="flex items-center gap-2 text-xs font-bold text-cyan-300 bg-cyan-950/50 border border-cyan-400/50 px-3.5 py-1.5 rounded-full w-fit mb-5 shadow-[0_0_20px_rgba(6,182,212,0.4)]">
      <i class="fa-regular fa-eye text-pink-400 text-sm"></i>
      <span id="view-count" class="tracking-wide">2,885</span>
    </div>

    <!-- Center Profile Header -->
    <div class="flex flex-col items-center text-center">
      
      <!-- Profile Picture (High Reliability Fallback) -->
      <div class="relative group mb-5">
        <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-full p-[3.5px] neon-avatar-ring">
          <img 
            id="main-avatar"
            src="https://unavatar.io/youtube/@LolYouAllBS" 
            alt="LolYouAll Profile Picture" 
            class="w-full h-full object-cover rounded-full bg-[#111] transition-transform duration-300 group-hover:scale-105"
            onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=300';"
          />
        </div>
      </div>

      <!-- Username & Badges with Glitch Effect -->
      <div class="flex items-center justify-center gap-2.5 mb-1.5">
        <h1 
          class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white font-['Syne'] glitch-text drop-shadow-[0_0_25px_rgba(168,85,247,0.9)]"
          data-text="LolYouAll"
        >
          LolYouAll
        </h1>
        <div class="flex items-center gap-1.5 bg-purple-900/40 border border-purple-400/50 px-2.5 py-1 rounded-full text-xs text-purple-200 shadow-[0_0_15px_rgba(168,85,247,0.4)]">
          <i class="fa-solid fa-sparkles text-cyan-300 text-[11px]"></i>
          <i class="fa-regular fa-gem text-pink-400 text-[11px]"></i>
        </div>
      </div>

      <!-- Subtitle Handle -->
      <p class="text-sm text-gray-300 font-medium mb-7">
        Video Production <span class="text-pink-400 mx-1.5">•</span> <span class="text-cyan-300 font-bold shadow-sm">@LolYouAll</span>
      </p>

      <!-- Social Links Row -->
      <div class="flex items-center justify-center gap-3.5 mb-8 w-full">
        <!-- YouTube -->
        <a href="https://www.youtube.com/@LolYouAllBS" target="_blank" rel="noopener noreferrer" class="neon-social-btn" title="YouTube Channel">
          <i class="fa-brands fa-youtube"></i>
        </a>
        <!-- Discord Server -->
        <a href="https://discord.gg/KAyKNPFY56" target="_blank" rel="noopener noreferrer" class="neon-social-btn" title="Discord Server">
          <i class="fa-brands fa-discord"></i>
        </a>
        <!-- Creator Studio -->
        <a href="https://www.youtube.com/@LolYouAllBS" target="_blank" rel="noopener noreferrer" class="neon-social-btn" title="Creator Studio">
          <i class="fa-solid fa-video"></i>
        </a>
        <!-- Copy Page URL -->
        <button onclick="copyProfileLink()" class="neon-social-btn cursor-pointer" title="Copy Web Link">
          <i class="fa-solid fa-link"></i>
        </button>
      </div>

    </div>

    <!-- Divider Line -->
    <div class="w-full h-[1.5px] bg-gradient-to-r from-transparent via-cyan-400 to-transparent mb-6 shadow-[0_0_15px_rgba(6,182,212,0.6)]"></div>

    <!-- Discord Status Widget -->
    <div class="cyber-pill rounded-[22px] p-4 flex items-center justify-between gap-3">
      
      <div class="flex items-center gap-3.5 overflow-hidden">
        <!-- Discord Avatar with Status Indicator -->
        <div class="relative flex-shrink-0">
          <img 
            id="discord-avatar"
            src="https://unavatar.io/youtube/@LolYouAllBS" 
            alt="Discord Avatar" 
            class="w-12 h-12 rounded-full object-cover bg-black/50 border-1.5 border-purple-400/60 shadow-[0_0_20px_rgba(168,85,247,0.4)]"
            onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=100';"
          />
          <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-[#0e0e12] rounded-full shadow-[0_0_10px_#10b981]" title="Online"></div>
        </div>

        <!-- Username & Status Message -->
        <div class="text-left overflow-hidden">
          <div class="flex items-center gap-1.5">
            <span class="font-bold text-sm text-white tracking-wide">@lolyouall</span>
            <i class="fa-solid fa-circle-check text-cyan-400 text-[11px]"></i>
          </div>
          <p class="text-xs text-purple-200 font-semibold truncate mt-0.5">
            Dont touch my Teddy 🔥❤️
          </p>
        </div>
      </div>

      <!-- Add on Discord Button -->
      <a 
        href="https://discord.com/users/978601102142476312" 
        target="_blank" 
        rel="noopener noreferrer" 
        class="flex-shrink-0 px-4 py-2 rounded-full text-xs font-extrabold bg-gradient-to-r from-purple-600 via-indigo-600 to-cyan-500 hover:from-purple-500 hover:to-cyan-400 text-white transition-all duration-200 shadow-[0_0_25px_rgba(168,85,247,0.6)] flex items-center gap-1.5"
      >
        <span>Add</span>
        <i class="fa-solid fa-arrow-right text-[11px]"></i>
      </a>

    </div>

  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-white text-black text-xs font-bold px-5 py-2.5 rounded-full shadow-[0_0_35px_rgba(255,255,255,0.9)] opacity-0 pointer-events-none z-50 flex items-center gap-2 transition-all duration-300">
    <i class="fa-solid fa-check text-emerald-600"></i>
    <span>Link copied to clipboard!</span>
  </div>

  <script>
    // 1. Copy Link Toast Function
    function copyProfileLink() {
      const dummy = document.createElement('input');
      document.body.appendChild(dummy);
      dummy.value = window.location.href;
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);

      const toast = document.getElementById('toast');
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100', '-translate-y-2');

      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
        toast.classList.remove('opacity-100', '-translate-y-2');
      }, 2500);
    }

    // 2. Cosmic Falling Galaxy Stones (Asteroids/Meteors) & Lightning Engine
    const bgCanvas = document.getElementById('galaxy-stones-canvas');
    const bgCtx = bgCanvas.getContext('2d');

    function resizeBg() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
    }
    resizeBg();
    window.addEventListener('resize', resizeBg);

    // Stars
    const stars = Array.from({ length: 250 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 2 + 0.3,
      alpha: Math.random(),
      speed: Math.random() * 0.015 + 0.003
    }));

    // Dynamic Procedural Falling Galaxy Stones (Asteroids)
    const galaxyStones = Array.from({ length: 14 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      radius: Math.random() * 14 + 8,
      sides: Math.floor(Math.random() * 3) + 5,
      angle: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.02,
      vy: Math.random() * 1.2 + 0.4,
      vx: (Math.random() - 0.5) * 0.4,
      glowColor: Math.random() > 0.5 ? '#a855f7' : (Math.random() > 0.5 ? '#06b6d4' : '#ec4899')
    }));

    // Meteors with Neon Tail Trails
    const meteors = Array.from({ length: 5 }, () => ({
      x: Math.random() * window.innerWidth,
      y: -50,
      length: Math.random() * 80 + 40,
      speed: Math.random() * 6 + 4,
      color: Math.random() > 0.5 ? '#06b6d4' : '#ec4899'
    }));

    // Lightning Flash Control
    let lightningTimer = 0;
    let lightningAlpha = 0;

    function renderCosmicScene() {
      bgCtx.fillStyle = '#020205';
      bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

      // Deep Space Volumetric Glowing Clouds
      const grad1 = bgCtx.createRadialGradient(bgCanvas.width * 0.25, bgCanvas.height * 0.35, 80, bgCanvas.width * 0.25, bgCanvas.height * 0.35, bgCanvas.width * 0.85);
      grad1.addColorStop(0, 'rgba(168, 85, 247, 0.22)');
      grad1.addColorStop(0.5, 'rgba(6, 182, 212, 0.1)');
      grad1.addColorStop(1, 'transparent');
      bgCtx.fillStyle = grad1;
      bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

      // Twinkling Stars
      for (let star of stars) {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
        bgCtx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, Math.min(1, star.alpha))})`;
        bgCtx.beginPath();
        bgCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        bgCtx.fill();
      }

      // Render Falling Meteors
      for (let m of meteors) {
        m.y += m.speed;
        m.x += m.speed * 0.3;

        if (m.y > bgCanvas.height + 100) {
          m.y = -50;
          m.x = Math.random() * bgCanvas.width;
        }

        const mGrad = bgCtx.createLinearGradient(m.x, m.y, m.x - m.length * 0.3, m.y - m.length);
        mGrad.addColorStop(0, '#ffffff');
        mGrad.addColorStop(0.3, m.color);
        mGrad.addColorStop(1, 'transparent');

        bgCtx.save();
        bgCtx.strokeStyle = mGrad;
        bgCtx.lineWidth = 2.5;
        bgCtx.shadowColor = m.color;
        bgCtx.shadowBlur = 15;
        bgCtx.beginPath();
        bgCtx.moveTo(m.x, m.y);
        bgCtx.lineTo(m.x - m.length * 0.3, m.y - m.length);
        bgCtx.stroke();
        bgCtx.restore();
      }

      // Render Falling Glowing Cosmic Galaxy Stones
      for (let stone of galaxyStones) {
        stone.y += stone.vy;
        stone.x += stone.vx;
        stone.angle += stone.rotSpeed;

        if (stone.y > bgCanvas.height + 40) {
          stone.y = -40;
          stone.x = Math.random() * bgCanvas.width;
        }

        bgCtx.save();
        bgCtx.translate(stone.x, stone.y);
        bgCtx.rotate(stone.angle);

        bgCtx.shadowColor = stone.glowColor;
        bgCtx.shadowBlur = 20;

        // Polygon Stone Shape
        bgCtx.fillStyle = '#1e1b2e';
        bgCtx.strokeStyle = stone.glowColor;
        bgCtx.lineWidth = 2;

        bgCtx.beginPath();
        for (let i = 0; i < stone.sides; i++) {
          const a = (i / stone.sides) * Math.PI * 2;
          const r = stone.radius * (0.8 + Math.sin(i * 2) * 0.2);
          const px = Math.cos(a) * r;
          const py = Math.sin(a) * r;
          if (i === 0) bgCtx.moveTo(px, py);
          else bgCtx.lineTo(px, py);
        }
        bgCtx.closePath();
        bgCtx.fill();
        bgCtx.stroke();

        ctxCoreGlow = bgCtx.createRadialGradient(0, 0, 1, 0, 0, stone.radius);
        ctxCoreGlow.addColorStop(0, stone.glowColor);
        ctxCoreGlow.addColorStop(1, 'transparent');
        bgCtx.fillStyle = ctxCoreGlow;
        bgCtx.fill();

        bgCtx.restore();
      }

      // Lightning Procedural Trigger
      lightningTimer++;
      if (lightningTimer > 160 + Math.random() * 200) {
        lightningAlpha = 0.8;
        lightningTimer = 0;
      }

      if (lightningAlpha > 0) {
        bgCtx.fillStyle = `rgba(168, 85, 247, ${lightningAlpha * 0.15})`;
        bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
        lightningAlpha -= 0.04;
      }

      requestAnimationFrame(renderCosmicScene);
    }
    renderCosmicScene();

    // 3. Pure White Pixel UFO Mouse Follower Engine
    const ufoCanvas = document.getElementById('ufo-canvas');
    const ufoCtx = ufoCanvas.getContext('2d');

    function resizeUfo() {
      ufoCanvas.width = window.innerWidth;
      ufoCanvas.height = window.innerHeight;
      ufoCtx.imageSmoothingEnabled = false;
    }
    resizeUfo();
    window.addEventListener('resize', resizeUfo);

    const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    const ufo = { x: window.innerWidth / 2, y: window.innerHeight / 2, float: 0 };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    const whiteUfoSprite = [
      "......WWWW......",
      ".....WWWWWW.....",
      "....WWWWWWWW....",
      "...WWWWWWWWWW...",
      "..WWWWWWWWWWWW..",
      ".WWWWWWWWWWWWWW.",
      "WWWWWWWWWWWWWWWW",
      ".WWWWWWWWWWWWWW.",
      "..WWWWWWWWWWWW..",
      "....WWWWWWWW...."
    ];

    function animateUFO() {
      ufoCtx.clearRect(0, 0, ufoCanvas.width, ufoCanvas.height);

      ufo.float += 0.06;
      const hoverY = Math.sin(ufo.float) * 3.5;

      ufo.x += (mouse.x - ufo.x) * 0.08;
      ufo.y += (mouse.y - 18 + hoverY - ufo.y) * 0.08;

      ufoCtx.save();
      ufoCtx.translate(ufo.x, ufo.y);

      // Pure White Glowing Beam Cone
      const beamGrad = ufoCtx.createLinearGradient(0, 0, 0, 55);
      beamGrad.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
      beamGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      
      ufoCtx.beginPath();
      ufoCtx.moveTo(-10, 5);
      ufoCtx.lineTo(10, 5);
      ufoCtx.lineTo(24, 55);
      ufoCtx.lineTo(-24, 55);
      ufoCtx.closePath();
      ufoCtx.fillStyle = beamGrad;
      ufoCtx.fill();

      // Render Pixel Saucer Sprite
      const pixelSize = 2.2;
      const rows = whiteUfoSprite.length;
      const cols = whiteUfoSprite[0].length;
      const offsetX = -(cols * pixelSize) / 2;
      const offsetY = -(rows * pixelSize) / 2;

      ufoCtx.fillStyle = '#ffffff';
      ufoCtx.shadowColor = '#ffffff';
      ufoCtx.shadowBlur = 18;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (whiteUfoSprite[r][c] === 'W') {
            ufoCtx.fillRect(
              Math.floor(offsetX + c * pixelSize),
              Math.floor(offsetY + r * pixelSize),
              pixelSize,
              pixelSize
            );
          }
        }
      }

      ufoCtx.restore();
      requestAnimationFrame(animateUFO);
    }
    animateUFO();
  </script>
</body>
</html>
